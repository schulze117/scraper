name: Run Immoscout Scraper

# Triggered from the VPS, not by GitHub. `/etc/cron.d/fixfolio` there fires this
# through the REST API, and the cadence and the work budget both live in it.
# (This repo is public — the host is named in ../infrastructure.md, not here.)
# GitHub's own `schedule:` is deliberately absent: it dispatched events
# 35-50 min late at rest and from 2026-08-26 dropped roughly two thirds of them
# account-wide, leaving no record, no failure and no log. See ../ecosystem.md.
on:
  workflow_dispatch:
    inputs:
      time_budget_min:
        description: 'Minutes of scraping before the run stops itself (0 = unlimited)'
        required: false
        default: '170'
      use_proxy:
        description: 'Route through the AI-server proxy over Tailscale (set false to force a direct, unproxied run)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# One scraper at a time. A backlog drain can run long; without this the every-2h
# schedule would stack overlapping runs all hammering the one residential proxy.
# New triggers queue (at most one pending) instead of cancelling the active run.
concurrency:
  group: immoscout-scrape
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest

    # Backstop only. GitHub kills a hosted job at 6 h and reports that as
    # `cancelled` — no exit code, no summary, looks exactly like a crash. The
    # scraper stops itself at `time_budget_min` well before this, so hitting 195
    # means the budget failed to apply, and a red run says so.
    #
    # **It must stay above the budget the crontab passes in, or it becomes the
    # mechanism instead of the backstop — silently.** It was 120 against a
    # crontab budget of 170 from the move to 6-hourly slots until 2026-09-14, so
    # every single run was killed at 2 h and reported `cancelled`: no exit code,
    # no log line, ~50 min of scraping lost per cycle. Raising the crontab budget
    # means raising this in the same change.
    timeout-minutes: 195

    # Empty on a hand-run dispatch -> resolve_proxy() falls back to
    # config.scrape.immoscout.use_proxy (true) -> proxy on, and the scraper falls
    # back to BaseScraper.TIME_BUDGET_MIN. A dispatch with use_proxy=false forces
    # a direct run (only useful for A/B testing the WAF).
    env:
      USE_PROXY: ${{ inputs.use_proxy }}
      SCRAPE_TIME_BUDGET_MIN: ${{ inputs.time_budget_min }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Immoscout is fetched through the AI server (residential IP) to clear the
      # AWS WAF. The runner joins the tailnet and reaches the proxy privately at
      # 100.88.231.47:8888 (= PROXY_URL). The node is ephemeral, so it removes
      # itself when the job ends — nothing accumulates. Skipped only for an
      # explicit direct run.
      - name: Connect to Tailscale
        if: ${{ inputs.use_proxy != 'false' }}
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: gha-immoscout-scrape

      - name: Create config.json
        env:
          CONFIG_JSON_CONTENT: ${{ vars.CONFIG_FILE }}
        run: echo "$CONFIG_JSON_CONTENT" > config.json

      - name: Create .env file
        run: |
          touch .env
          echo "DATABASE__USER=${{ secrets.DATABASE__USER }}" >> .env
          echo "DATABASE__HOST=${{ secrets.DATABASE__HOST }}" >> .env
          echo "DATABASE__NAME=${{ secrets.DATABASE__NAME }}" >> .env
          echo "DATABASE__PASSWORD=${{ secrets.DATABASE__PASSWORD }}" >> .env
          echo "DATABASE__PORT=${{ secrets.DATABASE__PORT }}" >> .env
          echo "PROXY_URL=${{ secrets.PROXY_URL }}" >> .env

      - name: Run Immoscout Scraper
        run: python -m scrape.immoscout
