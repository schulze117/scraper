name: Run Kleinanzeigen Scraper

# Triggered from the VPS, not by GitHub — see immoscout_scrape.yaml and
# ../ecosystem.md. The cadence and the work budget live in /etc/cron.d/fixfolio.
on:
  workflow_dispatch:
    inputs:
      time_budget_min:
        description: 'Minutes of scraping before the run stops itself (0 = unlimited)'
        required: false
        default: '320'

# One scraper at a time — see immowelt_scrape.yaml. New triggers queue (at most
# one pending) instead of cancelling the active run.
concurrency:
  group: kleinanzeigen-scrape
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest

    # Backstop only — see immoscout_scrape.yaml. The scraper stops itself at
    # `time_budget_min` long before this. This is the one scraper that is
    # genuinely throughput-limited (26 248 listings in a single 327 min run on
    # 2026-08-29), so it is also the one budgeted closest to the 6 h kill.
    timeout-minutes: 345

    env:
      SCRAPE_TIME_BUDGET_MIN: ${{ inputs.time_budget_min }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create config.json
        env:
          CONFIG_JSON_CONTENT: ${{ vars.CONFIG_FILE }}
        run: echo "$CONFIG_JSON_CONTENT" > config.json

      - name: Create .env file
        run: |
          touch .env
          echo "DATABASE__USER=${{ secrets.DATABASE__USER }}" >> .env
          echo "DATABASE__HOST=${{ secrets.DATABASE__HOST }}" >> .env
          echo "DATABASE__NAME=${{ secrets.DATABASE__NAME }}" >> .env
          echo "DATABASE__PASSWORD=${{ secrets.DATABASE__PASSWORD }}" >> .env
          echo "DATABASE__PORT=${{ secrets.DATABASE__PORT }}" >> .env

      - name: Run Kleinanzeigen Scraper
        run: python -m scrape.kleinanzeigen
