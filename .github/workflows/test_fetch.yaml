name: Test Fetch URL

# Manual tool: fetch any URL through the SAME fetch layer the finder/scraper
# use, and report HTML length + a screenshot + the raw HTML as an artifact.
# Handy for debugging bot detection on a real GitHub Actions runner IP.

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to fetch (e.g. an immoscout search/expose URL)'
        required: true
      method:
        description: 'Fetcher to use'
        required: true
        default: 'seleniumbase'
        type: choice
        options:
          - seleniumbase
          - curl_cffi
      runner:
        description: 'Runner OS (arm64 = apt Chromium; windows = different OS/env)'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
      use_proxy:
        description: 'Route the fetch through the PROXY_URL secret (residential exit IP)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        shell: bash   # use bash on Windows runners too (Git Bash is preinstalled)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # ARM64 runners have no preinstalled google-chrome; apt Chromium is a real
      # deb there (unlike the broken x86 snap) and becomes the auto-detected
      # browser. mdmintz uses this exact setup to beat DataDome on ARM.
      - name: Install Chromium (ARM64 only)
        if: ${{ contains(inputs.runner, 'arm') }}
        run: sudo apt-get update && sudo apt-get install -y chromium

      # When proxying, join the tailnet so the runner can reach the AI-server
      # proxy (PROXY_URL = 100.88.231.47:8888) privately over Tailscale.
      - name: Connect to Tailscale
        if: ${{ inputs.use_proxy }}
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: gha-test-fetch

      - name: Create config.json
        env:
          CONFIG_JSON_CONTENT: ${{ vars.CONFIG_FILE }}
        run: echo "$CONFIG_JSON_CONTENT" > config.json

      # The proxy comes in as an env var, never as a CLI arg — argv shows up in
      # the run log. --use-proxy makes fetch_url read PROXY_URL itself.
      - name: Fetch the URL
        id: fetch
        continue-on-error: true
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          set +e
          PROXY_FLAG=""
          if [ "${{ inputs.use_proxy }}" = "true" ]; then PROXY_FLAG="--use-proxy"; fi
          python -m lib.fetch.fetch_url --url "${{ inputs.url }}" --method "${{ inputs.method }}" --out-dir test_output $PROXY_FLAG
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Upload result (HTML + screenshot)
        uses: actions/upload-artifact@v4
        with:
          name: fetch-result
          path: test_output/
          if-no-files-found: warn

      - name: Report bot detection
        if: ${{ steps.fetch.outputs.exit_code == '42' }}
        run: |
          echo "::warning::Fetch returned a bot-detection / captcha page (exit 42)."
