name: Run Immowelt Sweep

# The last_seen_at sweep, NOT the finder that hunts for new listings. See
# immoscout_sweep.yaml for why this exists; ../reconcile.py consumes it.
#
# Two groups, each swept three times a week by the VPS crontab (Mon/Wed/Fri,
# Tue/Thu/Sat): houses against flats.
#
# Split over many runners (find/shards.py). DataDome walls immowelt after
# roughly 30-45 search pages per IP, and each job here gets a fresh runner IP, so
# a slice of 15 pages finishes before any wall. The sweep used to fall back to
# the home proxy at the wall instead, until immowelt blocked the home IP as well
# (2026-11-18). Nothing here touches the proxy any more.
#
#   plan    opens the sweep_run row, reads page 1 of every category/location and
#           cuts the rest into slices
#   sweep   one job per slice, in parallel
#   finish  closes the row: complete only if page 1 and every slice were read
#
# A sweep that misses anything records complete=false and reconcile.py then does
# nothing for the source, rather than deactivating what the crawl never reached.
on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Categories to sweep, comma-separated (WOHNUNG_KAUFEN, WOHNUNG_MIETEN, HAUS_KAUFEN, HAUS_MIETEN)'
        required: true
        type: string

permissions:
  contents: read

# Own group — see immoscout_sweep.yaml.
concurrency:
  group: immowelt-sweep
  cancel-in-progress: false

env:
  USE_PROXY: 'false'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: gha-immowelt-sweep-plan
      - name: Create config.json
        env:
          CONFIG_JSON_CONTENT: ${{ vars.CONFIG_FILE }}
        run: echo "$CONFIG_JSON_CONTENT" > config.json
      - name: Create .env file
        run: |
          echo "DATABASE__USER=${{ secrets.DATABASE__USER }}" >> .env
          echo "DATABASE__HOST=${{ secrets.DATABASE__HOST }}" >> .env
          echo "DATABASE__NAME=${{ secrets.DATABASE__NAME }}" >> .env
          echo "DATABASE__PASSWORD=${{ secrets.DATABASE__PASSWORD }}" >> .env
          echo "DATABASE__PORT=${{ secrets.DATABASE__PORT }}" >> .env
      - name: Plan ${{ inputs.category }}
        id: plan
        run: |
          python -m find.shards plan --portal immowelt --category "${{ inputs.category }}" --out plan.json
          python -c "import json; p=json.load(open('plan.json')); print('matrix='+json.dumps(p['shards'],separators=(',',':'))); print('count=%d' % len(p['shards']))" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: plan.json

  sweep:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Leaves room under GitHub's 20 concurrent jobs for the finders and
      # scrapers of this repo.
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: gha-immowelt-sweep-${{ strategy.job-index }}
      - name: Create config.json
        env:
          CONFIG_JSON_CONTENT: ${{ vars.CONFIG_FILE }}
        run: echo "$CONFIG_JSON_CONTENT" > config.json
      - name: Create .env file
        run: |
          echo "DATABASE__USER=${{ secrets.DATABASE__USER }}" >> .env
          echo "DATABASE__HOST=${{ secrets.DATABASE__HOST }}" >> .env
          echo "DATABASE__NAME=${{ secrets.DATABASE__NAME }}" >> .env
          echo "DATABASE__PASSWORD=${{ secrets.DATABASE__PASSWORD }}" >> .env
          echo "DATABASE__PORT=${{ secrets.DATABASE__PORT }}" >> .env
      - name: Sweep ${{ matrix.category }}/${{ matrix.location }} pages ${{ matrix.first }}-${{ matrix.last }}
        run: >
          python -m find.shards shard --portal immowelt
          --category ${{ matrix.category }} --location ${{ matrix.location }}
          --first ${{ matrix.first }} --last ${{ matrix.last }}
          ${{ matrix.open_end && '--open-end' || '' }}
          --out result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slice-${{ strategy.job-index }}
          path: result.json
          if-no-files-found: ignore

  finish:
    needs: [plan, sweep]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: gha-immowelt-sweep-finish
      - name: Create config.json
        env:
          CONFIG_JSON_CONTENT: ${{ vars.CONFIG_FILE }}
        run: echo "$CONFIG_JSON_CONTENT" > config.json
      - name: Create .env file
        run: |
          echo "DATABASE__USER=${{ secrets.DATABASE__USER }}" >> .env
          echo "DATABASE__HOST=${{ secrets.DATABASE__HOST }}" >> .env
          echo "DATABASE__NAME=${{ secrets.DATABASE__NAME }}" >> .env
          echo "DATABASE__PASSWORD=${{ secrets.DATABASE__PASSWORD }}" >> .env
          echo "DATABASE__PORT=${{ secrets.DATABASE__PORT }}" >> .env
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - uses: actions/download-artifact@v4
        # No slices at all when every category fits on page 1.
        continue-on-error: true
        with:
          pattern: slice-*
          path: results
      - name: Close the sweep record
        run: |
          mkdir -p flat
          i=0; for f in results/*/result.json; do [ -f "$f" ] && cp "$f" "flat/$((i++)).json"; done
          python -m find.shards finish --plan plan.json --results flat
