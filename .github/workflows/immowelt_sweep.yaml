name: Run Immowelt Sweep

# The weekly last_seen_at sweep, NOT the finder that hunts for new listings.
# See immoscout_sweep.yaml for why this exists; ../reconcile.py consumes it.
#
# Two groups, each swept three times a week by the VPS crontab (Mon/Wed/Fri,
# Tue/Thu/Sat). The balanced split here falls on a different axis than
# immoscout's: houses against flats, 178 vs 200 pages, because HAUS_KAUFEN alone
# is 172 of the 378.
#
# Depth is the whole point here and also the whole risk: from a GitHub runner IP
# DataDome walls the sweep around page 45, which is why the incremental finder
# caps at MAX_PAGES=20 and why this workflow never completed a category. The
# residential exit removes that wall entirely — 174/174 pages, zero blocks, on
# run 34883536366 (2026-09-14) — so use_proxy defaults to true here.
#
# A sweep that does get blocked deep costs the pages behind the block and nothing
# else: it records complete=false and reconcile.py then does nothing for the
# source at all, rather than deactivating what the crawl never reached.
on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Categories to sweep, comma-separated (WOHNUNG_KAUFEN, WOHNUNG_MIETEN, HAUS_KAUFEN, HAUS_MIETEN)'
        required: true
        type: string
      use_proxy:
        description: 'Route through the AI-server residential proxy over Tailscale'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# Own group — see immoscout_sweep.yaml.
concurrency:
  group: immowelt-sweep
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    # On by default since 2026-09-16. Direct from a GitHub runner this sweep
    # aborted at page 48-49 of 172 every time and recorded complete=false, which
    # is what kept immowelt out of reconcile.py; through the residential exit the
    # same category walked all 174 pages with zero blocks.
    #
    # The proxy is a shared resource: the same AI server carries immoscout find
    # and scrape and the immoscout sweep, and the crontab keeps all of them apart
    # on purpose -- this one has the 06:00 slot. Check what else holds it before
    # dispatching an off-schedule run -- ../ecosystem.md#schedules.
    env:
      USE_PROXY: ${{ inputs.use_proxy }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Connect to Tailscale
        if: ${{ inputs.use_proxy }}
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: gha-immowelt-sweep

      - name: Create config.json
        env:
          CONFIG_JSON_CONTENT: ${{ vars.CONFIG_FILE }}
        run: echo "$CONFIG_JSON_CONTENT" > config.json

      - name: Create .env file
        run: |
          touch .env
          echo "DATABASE__USER=${{ secrets.DATABASE__USER }}" >> .env
          echo "DATABASE__HOST=${{ secrets.DATABASE__HOST }}" >> .env
          echo "DATABASE__NAME=${{ secrets.DATABASE__NAME }}" >> .env
          echo "DATABASE__PASSWORD=${{ secrets.DATABASE__PASSWORD }}" >> .env
          echo "DATABASE__PORT=${{ secrets.DATABASE__PORT }}" >> .env
          echo "PROXY_URL=${{ secrets.PROXY_URL }}" >> .env

      # No retry-on-42 step. The finder never exits 42 -- a blocked page is a
      # failed page and costs the sweep its `complete` -- and through the proxy
      # a fresh runner would not bring a fresh exit IP anyway.
      - name: Sweep ${{ inputs.category }}
        run: python -m find.immowelt --sweep --category "${{ inputs.category }}"
