name: Run Immowelt Sweep

# The weekly last_seen_at sweep, NOT the finder that hunts for new listings.
# See immoscout_sweep.yaml for why this exists; ../reconcile.py consumes it.
#
# Two groups, each swept three times a week by the VPS crontab (Mon/Wed/Fri,
# Tue/Thu/Sat). The balanced split here falls on a different axis than
# immoscout's: houses against flats, 178 vs 200 pages, because HAUS_KAUFEN alone
# is 172 of the 378.
#
# Depth is the whole point here and also the whole risk: DataDome starts blocking
# immowelt around page 45, which is exactly why the incremental finder caps at
# MAX_PAGES=20. A sweep that gets blocked deep costs the pages behind the block
# and nothing else — it records complete=false and reconcile.py then does nothing
# for the source at all, rather than deactivating what the crawl never reached. A
# sweep that takes the incremental finder's IP down with it would cost far more,
# hence the separate slot in the crontab.
on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Categories to sweep, comma-separated (WOHNUNG_KAUFEN, WOHNUNG_MIETEN, HAUS_KAUFEN, HAUS_MIETEN)'
        required: true
        type: string
      use_proxy:
        description: 'Route through the AI-server residential proxy over Tailscale'
        required: false
        default: false
        type: boolean
      retry_count:
        description: 'Bot detection retry attempt'
        required: false
        default: '0'

permissions:
  contents: read
  actions: write

# Own group — see immoscout_sweep.yaml.
concurrency:
  group: immowelt-sweep
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    # Off by default, unlike immoscout. immowelt has always run direct from the
    # GitHub runner and DataDome tolerates that far better than immoscout's WAF
    # tolerates a datacenter IP -- but it still walls the sweep at page 49 of
    # 172, which is the one thing that keeps immowelt out of reconcile.py. This
    # switch exists to test whether the residential exit clears that wall.
    #
    # It is a shared resource: the same AI server carries immoscout find and
    # scrape, and the crontab keeps those two apart on purpose. A proxied
    # immowelt sweep is a third user of it, so check what else holds it before
    # dispatching one -- ../ecosystem.md#schedules.
    env:
      USE_PROXY: ${{ inputs.use_proxy }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Connect to Tailscale
        if: ${{ inputs.use_proxy }}
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gha-immowelt-sweep

      - name: Create config.json
        env:
          CONFIG_JSON_CONTENT: ${{ vars.CONFIG_FILE }}
        run: echo "$CONFIG_JSON_CONTENT" > config.json

      - name: Create .env file
        run: |
          touch .env
          echo "DATABASE__USER=${{ secrets.DATABASE__USER }}" >> .env
          echo "DATABASE__HOST=${{ secrets.DATABASE__HOST }}" >> .env
          echo "DATABASE__NAME=${{ secrets.DATABASE__NAME }}" >> .env
          echo "DATABASE__PASSWORD=${{ secrets.DATABASE__PASSWORD }}" >> .env
          echo "DATABASE__PORT=${{ secrets.DATABASE__PORT }}" >> .env
          # PROXY_URL only. `resolve_proxy` prefers PROXY_URL__IMMOWELT, and
          # that secret still holds the metered DataImpulse endpoint -- writing
          # it here would silently send this run somewhere other than the AI
          # server, which is the whole thing being tested.
          echo "PROXY_URL=${{ secrets.PROXY_URL }}" >> .env

      - name: Create Service Account JSON
        run: echo '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}' > immofinder-438008-411bf1440a6c.json

      - name: Sweep ${{ inputs.category }}
        id: run
        continue-on-error: true
        run: |
          set +e
          python -m find.immowelt --sweep --category "${{ inputs.category }}"
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      # The retry has to carry the category forward. Without it a blocked sweep
      # would come back as an all-category run, which is the thing this workflow
      # is split up to avoid.
      - name: Retry on bot detection
        if: steps.run.outputs.exit_code == '42'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          RETRY="${{ inputs.retry_count }}"
          RETRY=${RETRY:-0}
          MAX=5
          if [ "$RETRY" -lt "$MAX" ]; then
            echo "Bot detected (attempt $((RETRY+1))/$MAX). Dispatching retry with new IP..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/immowelt_sweep.yaml/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":{\"retry_count\":\"$((RETRY+1))\",\"category\":\"${{ inputs.category }}\",\"use_proxy\":${{ inputs.use_proxy }}}}")
            echo "API response: $STATUS"
            [ "$STATUS" = "204" ] || exit 1
          else
            echo "Max retries ($MAX) reached."
            exit 1
          fi

      - name: Fail on non-bot errors
        if: steps.run.outcome == 'failure' && steps.run.outputs.exit_code != '42'
        run: exit 1
