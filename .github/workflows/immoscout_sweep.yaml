name: Run Immoscout Sweep

# The weekly last_seen_at sweep, NOT the finder that hunts for new listings.
#
# The incremental finder (immoscout_find.yaml) stops after three pages with
# nothing new, so it never reaches the older listings and never refreshes their
# `system.last_seen_at`. This run crawls one category to its last page, which
# refreshes the whole live inventory of that category. `expire.py` turns that
# into `general.active`.
#
# One category per day, rotated by the VPS crontab — five categories, five days.
# Split that way because a full crawl of all five in one run is hours on the one
# residential IP that clears the WAF, and because a blocked run then only costs
# that day's category instead of the lot.
on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Category to sweep (WOHNUNG_KAUFEN, WOHNUNG_MIETEN, HAUS_KAUFEN, HAUS_MIETEN, NEUBAUWOHNUNG_KAUFEN)'
        required: true
        type: string
      use_proxy:
        description: 'Route through the AI-server proxy over Tailscale (set false to force a direct, unproxied run)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# Its own group, not immoscout-find's. Sharing one would let a multi-hour sweep
# push a queued incremental run out entirely (GitHub keeps only one pending run
# per group), and losing new listings is worse than the proxy contention. The
# separation is paid for in the crontab instead: the sweep gets a slot no other
# immoscout job uses.
concurrency:
  group: immoscout-sweep
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    # ~453 pages at ~30 s is close to 4 h. Fail on our own clock rather than be
    # killed at GitHub's 6 h with no explanation.
    timeout-minutes: 330

    env:
      USE_PROXY: ${{ inputs.use_proxy }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Connect to Tailscale
        if: ${{ inputs.use_proxy != 'false' }}
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gha-immoscout-sweep

      - name: Create config.json
        env:
          CONFIG_JSON_CONTENT: ${{ vars.CONFIG_FILE }}
        run: echo "$CONFIG_JSON_CONTENT" > config.json

      - name: Create .env file
        run: |
          touch .env
          echo "DATABASE__USER=${{ secrets.DATABASE__USER }}" >> .env
          echo "DATABASE__HOST=${{ secrets.DATABASE__HOST }}" >> .env
          echo "DATABASE__NAME=${{ secrets.DATABASE__NAME }}" >> .env
          echo "DATABASE__PASSWORD=${{ secrets.DATABASE__PASSWORD }}" >> .env
          echo "DATABASE__PORT=${{ secrets.DATABASE__PORT }}" >> .env
          echo "PROXY_URL=${{ secrets.PROXY_URL }}" >> .env

      - name: Sweep ${{ inputs.category }}
        run: python -m find.immoscout --sweep --category "${{ inputs.category }}"
