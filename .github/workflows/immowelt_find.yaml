name: Run Immowelt Finder

# Triggered from the VPS, not by GitHub — see immoscout_scrape.yaml and
# ../ecosystem.md. The cadence lives in /etc/cron.d/fixfolio.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create config.json
        env:
          CONFIG_JSON_CONTENT: ${{ vars.CONFIG_FILE }}
        run: echo "$CONFIG_JSON_CONTENT" > config.json

      - name: Create .env file
        run: |
          touch .env
          echo "DATABASE__USER=${{ secrets.DATABASE__USER }}" >> .env
          echo "DATABASE__HOST=${{ secrets.DATABASE__HOST }}" >> .env
          echo "DATABASE__NAME=${{ secrets.DATABASE__NAME }}" >> .env
          echo "DATABASE__PASSWORD=${{ secrets.DATABASE__PASSWORD }}" >> .env
          echo "DATABASE__PORT=${{ secrets.DATABASE__PORT }}" >> .env

      # No retry-on-42 step, unlike immowelt_scrape.yaml. The finder never exits
      # 42: a blocked page is a failed page, and a lost page 1 ends the run red
      # with 1 (FinderFailedError). The step that used to sit here re-dispatched
      # on an exit code nothing could produce.
      - name: Run Immowelt Finder
        run: python -m find.immowelt
