name: Expire Stale Listings

# Turns `system.last_seen_at` into `general.active`. Nothing else ever clears
# that flag for immoscout and immowelt — see ../expire.py for why.
#
# Depends on the weekly sweep rotation having run. Without it `last_seen_at` is
# stale for live listings too, and this job would mark most of the inventory
# offline. expire.py refuses when the stale share looks like a failed crawl
# rather than a week of listings going offline, so a missed sweep fails loudly
# instead of corrupting the flag.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write. Unset for a dry run that only reports.'
        required: false
        default: true
        type: boolean
      max_age_days:
        description: 'Expire listings not seen in this many days (default 21)'
        required: false
        default: ''
        type: string
      max_share:
        description: 'Refuse above this stale share (default 0.25). Raise only to clear the initial backlog, once.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: expire
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create config.json
        env:
          CONFIG_JSON_CONTENT: ${{ vars.CONFIG_FILE }}
        run: echo "$CONFIG_JSON_CONTENT" > config.json

      - name: Create .env file
        run: |
          touch .env
          echo "DATABASE__USER=${{ secrets.DATABASE__USER }}" >> .env
          echo "DATABASE__HOST=${{ secrets.DATABASE__HOST }}" >> .env
          echo "DATABASE__NAME=${{ secrets.DATABASE__NAME }}" >> .env
          echo "DATABASE__PASSWORD=${{ secrets.DATABASE__PASSWORD }}" >> .env
          echo "DATABASE__PORT=${{ secrets.DATABASE__PORT }}" >> .env

      # if/then, not `[ ... ] && ...`: GitHub runs this with `bash -e`, where a
      # failing test at the end of an && list aborts the whole step.
      - name: Expire
        env:
          APPLY: ${{ inputs.apply }}
          MAX_AGE_DAYS: ${{ inputs.max_age_days }}
          MAX_SHARE: ${{ inputs.max_share }}
        run: |
          ARGS=""
          if [ "$APPLY" = "true" ]; then ARGS="$ARGS --apply"; fi
          if [ -n "$MAX_AGE_DAYS" ]; then ARGS="$ARGS --max-age-days $MAX_AGE_DAYS"; fi
          if [ -n "$MAX_SHARE" ]; then ARGS="$ARGS --max-share $MAX_SHARE"; fi
          echo "python -m expire$ARGS"
          python -m expire $ARGS
