name: Run Immowelt Scraper

# Triggered from the VPS, not by GitHub — see immoscout_scrape.yaml and
# ../ecosystem.md. The cadence and the work budget live in /etc/cron.d/fixfolio.
on:
  workflow_dispatch:
    inputs:
      time_budget_min:
        description: 'Minutes of scraping before the run stops itself (0 = unlimited)'
        required: false
        default: '300'
      retry_count:
        description: 'Bot detection retry attempt'
        required: false
        default: '0'

permissions:
  contents: read
  actions: write

# One scraper at a time. A run that starts late (GitHub dispatches the schedule
# event 35-50 min after the slot) and spends its full TIME_BUDGET_MIN can still
# be going when the next slot arrives; without this the two would overlap and
# hammer the portal twice over. New triggers queue (at most one pending) instead
# of cancelling the active run.
concurrency:
  group: immowelt-scrape
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest

    # Backstop only — see immoscout_scrape.yaml, including why this has to stay
    # above the budget the crontab passes in. It was 240 against a budget of 300
    # until 2026-09-14, so every run died at 4 h as `cancelled`.
    timeout-minutes: 325

    env:
      SCRAPE_TIME_BUDGET_MIN: ${{ inputs.time_budget_min }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create config.json
        env:
          CONFIG_JSON_CONTENT: ${{ vars.CONFIG_FILE }}
        run: echo "$CONFIG_JSON_CONTENT" > config.json

      - name: Create .env file
        run: |
          touch .env
          echo "DATABASE__USER=${{ secrets.DATABASE__USER }}" >> .env
          echo "DATABASE__HOST=${{ secrets.DATABASE__HOST }}" >> .env
          echo "DATABASE__NAME=${{ secrets.DATABASE__NAME }}" >> .env
          echo "DATABASE__PASSWORD=${{ secrets.DATABASE__PASSWORD }}" >> .env
          echo "DATABASE__PORT=${{ secrets.DATABASE__PORT }}" >> .env

      - name: Run Immowelt Scraper
        id: run
        continue-on-error: true
        run: |
          set +e
          python -m scrape.immowelt
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: Retry on bot detection
        if: steps.run.outputs.exit_code == '42'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          RETRY="${{ inputs.retry_count }}"
          RETRY=${RETRY:-0}
          MAX=15
          if [ "$RETRY" -lt "$MAX" ]; then
            echo "Bot detected (attempt $((RETRY+1))/$MAX). Dispatching retry with new IP..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/immowelt_scrape.yaml/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":{\"retry_count\":\"$((RETRY+1))\"}}")
            echo "API response: $STATUS"
            [ "$STATUS" = "204" ] || exit 1
          else
            echo "Max retries ($MAX) reached."
            exit 1
          fi

      - name: Fail on non-bot errors
        if: steps.run.outcome == 'failure' && steps.run.outputs.exit_code != '42'
        run: exit 1
