name: Run Immowelt Scraper

# Triggered from the VPS, not by GitHub — see immoscout_scrape.yaml and
# ../ecosystem.md. The cadence and the work budget live in /etc/cron.d/fixfolio.
on:
  workflow_dispatch:
    inputs:
      time_budget_min:
        description: 'Minutes of scraping before the run stops itself (0 = unlimited)'
        required: false
        default: '300'
      use_proxy:
        description: 'Route through the AI-server residential proxy over Tailscale'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# One scraper at a time. A run that starts late (GitHub dispatches the schedule
# event 35-50 min after the slot) and spends its full TIME_BUDGET_MIN can still
# be going when the next slot arrives; without this the two would overlap and
# hammer the portal twice over. New triggers queue (at most one pending) instead
# of cancelling the active run.
concurrency:
  group: immowelt-scrape
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest

    # Backstop only — see immoscout_scrape.yaml, including why this has to stay
    # above the budget the crontab passes in. It was 240 against a budget of 300
    # until 2026-09-14, so every run died at 4 h as `cancelled`.
    timeout-minutes: 325

    # Proxied by default. Direct from a GitHub runner DataDome walled every run
    # after ~190 exposés (four runs, 2026-09-27/28); the residential exit is what
    # already carries the immowelt sweep. The proxy is shared -- the crontab keeps
    # this scrape's 03:10 slot clear of the 06:00 immowelt sweep.
    env:
      SCRAPE_TIME_BUDGET_MIN: ${{ inputs.time_budget_min }}
      USE_PROXY: ${{ inputs.use_proxy }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Connect to Tailscale
        if: ${{ inputs.use_proxy }}
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: gha-immowelt-scrape

      - name: Create config.json
        env:
          CONFIG_JSON_CONTENT: ${{ vars.CONFIG_FILE }}
        run: echo "$CONFIG_JSON_CONTENT" > config.json

      - name: Create .env file
        run: |
          touch .env
          echo "DATABASE__USER=${{ secrets.DATABASE__USER }}" >> .env
          echo "DATABASE__HOST=${{ secrets.DATABASE__HOST }}" >> .env
          echo "DATABASE__NAME=${{ secrets.DATABASE__NAME }}" >> .env
          echo "DATABASE__PASSWORD=${{ secrets.DATABASE__PASSWORD }}" >> .env
          echo "DATABASE__PORT=${{ secrets.DATABASE__PORT }}" >> .env
          echo "PROXY_URL=${{ secrets.PROXY_URL }}" >> .env

      # A walled IP (exit 42) ends the run red, like any other failure. No
      # re-dispatch: the cadence is the crontab's four slots a day, and through
      # the proxy a fresh runner would not bring a fresh exit IP anyway.
      - name: Run Immowelt Scraper
        run: python -m scrape.immowelt
