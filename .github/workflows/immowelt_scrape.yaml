name: Run Immowelt Scraper

# Triggered from the VPS, not by GitHub — see immoscout_scrape.yaml and
# ../ecosystem.md. The cadence and the work budget live in /etc/cron.d/fixfolio.
on:
  workflow_dispatch:
    inputs:
      time_budget_min:
        description: 'Minutes of scraping before the run stops itself (0 = unlimited)'
        required: false
        default: '300'

permissions:
  contents: read

# One scraper at a time. A run that starts late (GitHub dispatches the schedule
# event 35-50 min after the slot) and spends its full TIME_BUDGET_MIN can still
# be going when the next slot arrives; without this the two would overlap and
# hammer the portal twice over. New triggers queue (at most one pending) instead
# of cancelling the active run.
concurrency:
  group: immowelt-scrape
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest

    # Backstop only — see immoscout_scrape.yaml, including why this has to stay
    # above the budget the crontab passes in. It was 240 against a budget of 300
    # until 2026-09-14, so every run died at 4 h as `cancelled`.
    timeout-minutes: 325

    # Direct, never through the residential proxy. DataDome walls a runner IP
    # after ~30 exposés, or ~190 on about one runner in three, so the scraper
    # stops itself at 150
    # (ImmoweltScraper.MAX_LISTINGS_PER_RUN) and the next slot brings a fresh
    # runner. Through the proxy it was worse: a challenge on every page after ~44
    # and hard blocks from the second day (2026-09-28/29).
    env:
      SCRAPE_TIME_BUDGET_MIN: ${{ inputs.time_budget_min }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create config.json
        env:
          CONFIG_JSON_CONTENT: ${{ vars.CONFIG_FILE }}
        run: echo "$CONFIG_JSON_CONTENT" > config.json

      - name: Create .env file
        run: |
          touch .env
          echo "DATABASE__USER=${{ secrets.DATABASE__USER }}" >> .env
          echo "DATABASE__HOST=${{ secrets.DATABASE__HOST }}" >> .env
          echo "DATABASE__NAME=${{ secrets.DATABASE__NAME }}" >> .env
          echo "DATABASE__PASSWORD=${{ secrets.DATABASE__PASSWORD }}" >> .env
          echo "DATABASE__PORT=${{ secrets.DATABASE__PORT }}" >> .env

      # A wall below the cap (exit 42) ends the run red, like any other failure:
      # with the cap in place it is no longer the normal end of a run. No
      # re-dispatch -- the next of the crontab's four slots a day starts on a
      # fresh runner with a fresh IP.
      - name: Run Immowelt Scraper
        run: python -m scrape.immowelt
